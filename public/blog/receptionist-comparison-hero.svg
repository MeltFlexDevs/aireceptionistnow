<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="Three ways to answer business calls compared side by side: an answering service, a virtual receptionist, and an AI receptionist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9cdf0"/>
      <stop offset="0.48" stop-color="#dce6f2"/>
      <stop offset="1" stop-color="#c3ecd9"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- soft depth circles -->
  <circle cx="300" cy="230" r="150" fill="#ffffff" opacity="0.30" filter="url(#soft)"/>
  <circle cx="1320" cy="660" r="180" fill="#ffffff" opacity="0.25" filter="url(#soft)"/>

  <!-- glass panel -->
  <rect x="180" y="250" width="1240" height="400" rx="40" fill="#ffffff" opacity="0.45"/>
  <rect x="180.5" y="250.5" width="1239" height="399" rx="40" stroke="#ffffff" opacity="0.7"/>

  <!-- answering service: message note chip -->
  <g transform="translate(420 450)">
    <rect x="-115" y="-115" width="230" height="230" rx="40" fill="#ffffff" opacity="0.55"/>
    <rect x="-114.5" y="-114.5" width="229" height="229" rx="40" stroke="#ffffff" opacity="0.8"/>
    <g stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -48 -62 h 74 l 22 22 v 102 h -96 z"/>
      <path d="M 26 -62 v 22 h 22"/>
      <path d="M -28 -18 h 56"/>
      <path d="M -28 8 h 56"/>
      <path d="M -28 34 h 34"/>
    </g>
  </g>

  <!-- vs pill -->
  <g transform="translate(610 450)">
    <rect x="-38" y="-26" width="76" height="52" rx="26" fill="#111111"/>
    <text x="0" y="8" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff" letter-spacing="0.04em">vs</text>
  </g>

  <!-- virtual receptionist: headset chip -->
  <g transform="translate(800 450)">
    <rect x="-115" y="-115" width="230" height="230" rx="40" fill="#ffffff" opacity="0.55"/>
    <rect x="-114.5" y="-114.5" width="229" height="229" rx="40" stroke="#ffffff" opacity="0.8"/>
    <g stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -52 14 v -10 a 52 52 0 0 1 104 0 v 10"/>
      <rect x="-64" y="8" width="26" height="44" rx="12" fill="#1a1a1a"/>
      <rect x="38" y="8" width="26" height="44" rx="12" fill="#1a1a1a"/>
      <path d="M 51 52 v 8 a 22 22 0 0 1 -22 22 h -18"/>
      <circle cx="4" cy="82" r="7" fill="#1a1a1a" stroke="none"/>
    </g>
  </g>

  <!-- vs pill -->
  <g transform="translate(990 450)">
    <rect x="-38" y="-26" width="76" height="52" rx="26" fill="#111111"/>
    <text x="0" y="8" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff" letter-spacing="0.04em">vs</text>
  </g>

  <!-- AI receptionist: waveform chip -->
  <g transform="translate(1180 450)">
    <rect x="-115" y="-115" width="230" height="230" rx="40" fill="#111111"/>
    <g stroke="#ffffff" stroke-width="12" stroke-linecap="round">
      <path d="M -56 -16 v 32"/>
      <path d="M -28 -36 v 72"/>
      <path d="M 0 -54 v 108"/>
      <path d="M 28 -36 v 72"/>
      <path d="M 56 -16 v 32"/>
    </g>
    <path d="M 74 -88 l 6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" fill="#ffffff"/>
  </g>

  <!-- badge -->
  <g transform="translate(800 760)">
    <rect x="-160" y="-34" width="320" height="68" rx="34" fill="#111111"/>
    <text x="0" y="9" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff" letter-spacing="0.06em">WHO ANSWERS?</text>
  </g>
</svg>
