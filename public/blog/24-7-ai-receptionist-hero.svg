<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="An AI receptionist chip with a voice waveform inside a 24-hour clock ring, flanked by a sun and a moon - always-on phone coverage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9cdf0"/>
      <stop offset="0.48" stop-color="#dce6f2"/>
      <stop offset="1" stop-color="#c3ecd9"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- soft depth circles -->
  <circle cx="300" cy="230" r="150" fill="#ffffff" opacity="0.30" filter="url(#soft)"/>
  <circle cx="1320" cy="660" r="180" fill="#ffffff" opacity="0.25" filter="url(#soft)"/>

  <!-- glass panel -->
  <rect x="280" y="200" width="1040" height="500" rx="40" fill="#ffffff" opacity="0.45"/>
  <rect x="280.5" y="200.5" width="1039" height="499" rx="40" stroke="#ffffff" opacity="0.7"/>

  <!-- sun chip (daytime) -->
  <g transform="translate(470 450)">
    <rect x="-95" y="-95" width="190" height="190" rx="36" fill="#ffffff" opacity="0.55"/>
    <rect x="-94.5" y="-94.5" width="189" height="189" rx="36" stroke="#ffffff" opacity="0.8"/>
    <g stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="30"/>
      <path d="M 0 -58 v 14"/>
      <path d="M 0 44 v 14"/>
      <path d="M -58 0 h 14"/>
      <path d="M 44 0 h 14"/>
      <path d="M -41 -41 l 10 10"/>
      <path d="M 31 31 l 10 10"/>
      <path d="M 41 -41 l -10 10"/>
      <path d="M -31 31 l -10 10"/>
    </g>
  </g>

  <!-- centre: AI chip inside clock ring -->
  <g transform="translate(800 450)">
    <circle cx="0" cy="0" r="170" fill="none" stroke="#1a1a1a" stroke-width="6" opacity="0.85" stroke-dasharray="4 22" stroke-linecap="round"/>
    <rect x="-115" y="-115" width="230" height="230" rx="40" fill="#111111"/>
    <g stroke="#ffffff" stroke-width="12" stroke-linecap="round">
      <path d="M -56 -16 v 32"/>
      <path d="M -28 -36 v 72"/>
      <path d="M 0 -54 v 108"/>
      <path d="M 28 -36 v 72"/>
      <path d="M 56 -16 v 32"/>
    </g>
    <path d="M 74 -88 l 6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" fill="#ffffff"/>
  </g>

  <!-- moon chip (night) -->
  <g transform="translate(1130 450)">
    <rect x="-95" y="-95" width="190" height="190" rx="36" fill="#ffffff" opacity="0.55"/>
    <rect x="-94.5" y="-94.5" width="189" height="189" rx="36" stroke="#ffffff" opacity="0.8"/>
    <path d="M 14 -46 a 46 46 0 1 0 32 78 a 40 40 0 0 1 -32 -78 z" stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#1a1a1a">
      <circle cx="44" cy="-52" r="4"/>
      <circle cx="60" cy="-30" r="3"/>
    </g>
  </g>

  <!-- badge -->
  <g transform="translate(800 760)">
    <rect x="-190" y="-34" width="380" height="68" rx="34" fill="#111111"/>
    <text x="0" y="9" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff" letter-spacing="0.06em">ANSWERED 24/7</text>
  </g>
</svg>
