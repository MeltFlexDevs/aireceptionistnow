<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="How a bilingual AI receptionist handles a call: it detects the caller's language on the first words and continues the whole conversation in that language">
  <rect width="1200" height="630" fill="#faf8ff"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#ece7f6"/>

  <text x="60" y="66" font-size="26" font-weight="600" fill="#1a1a1a">How a bilingual voice agent switches languages</text>
  <text x="60" y="100" font-size="16" fill="#8a8398">No &quot;press 2 for Spanish.&quot; It hears the language and mirrors it for the rest of the call.</text>

  <!-- Step 1 -->
  <g transform="translate(60 160)">
    <rect x="0" y="0" width="300" height="130" rx="18" fill="#ffffff" stroke="#e4def1" stroke-width="2"/>
    <text x="24" y="42" font-size="13" font-weight="700" fill="#5b3ef0" letter-spacing="0.06em">1 · GREET</text>
    <text x="24" y="76" font-size="16" fill="#3a3350">&quot;Thanks for calling Bright</text>
    <text x="24" y="100" font-size="16" fill="#3a3350">Dental – hola, how can I help?&quot;</text>
  </g>

  <g stroke="#c9c1dd" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 370 225 L 420 225"/>
    <path d="M 410 218 L 420 225 L 410 232"/>
  </g>

  <!-- Step 2 -->
  <g transform="translate(430 160)">
    <rect x="0" y="0" width="300" height="130" rx="18" fill="#ffffff" stroke="#e4def1" stroke-width="2"/>
    <text x="24" y="42" font-size="13" font-weight="700" fill="#5b3ef0" letter-spacing="0.06em">2 · DETECT</text>
    <text x="24" y="76" font-size="16" fill="#3a3350">Caller replies in Spanish.</text>
    <text x="24" y="100" font-size="16" fill="#3a3350">The agent recognizes it live.</text>
  </g>

  <g stroke="#c9c1dd" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 740 225 L 790 225"/>
    <path d="M 780 218 L 790 225 L 780 232"/>
  </g>

  <!-- Step 3 -->
  <g transform="translate(800 160)">
    <rect x="0" y="0" width="340" height="130" rx="18" fill="#111111"/>
    <text x="24" y="42" font-size="13" font-weight="700" fill="#ff8a3d" letter-spacing="0.06em">3 · MIRROR</text>
    <text x="24" y="76" font-size="16" fill="#ffffff">Continues in Spanish for the</text>
    <text x="24" y="100" font-size="16" fill="#ffffff">whole call – booking included.</text>
  </g>

  <!-- bottom row: what stays the same -->
  <g transform="translate(60 350)">
    <rect x="0" y="0" width="1080" height="220" rx="18" fill="#efeafe" stroke="#ddd3fb" stroke-width="2"/>
    <text x="30" y="46" font-size="13" font-weight="700" fill="#5b3ef0" letter-spacing="0.06em">WHAT DOESN&apos;T CHANGE, WHATEVER THE LANGUAGE</text>

    <g transform="translate(30 76)">
      <text x="0" y="20" font-size="16" font-weight="600" fill="#1a1a1a">Same calendar</text>
      <text x="0" y="46" font-size="14" fill="#6c6579">Books into the one system</text>
      <text x="0" y="68" font-size="14" fill="#6c6579">your team already uses.</text>
    </g>
    <g transform="translate(390 76)">
      <text x="0" y="20" font-size="16" font-weight="600" fill="#1a1a1a">Same summary</text>
      <text x="0" y="46" font-size="14" fill="#6c6579">You get the notes in English,</text>
      <text x="0" y="68" font-size="14" fill="#6c6579">even if the call was in Spanish.</text>
    </g>
    <g transform="translate(750 76)">
      <text x="0" y="20" font-size="16" font-weight="600" fill="#1a1a1a">Same escalation</text>
      <text x="0" y="46" font-size="14" fill="#6c6579">Hands off to a human when</text>
      <text x="0" y="68" font-size="14" fill="#6c6579">the call is beyond routine.</text>
    </g>
  </g>
</svg>
