<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="A ringing front-desk phone handing its calls to an AI receptionist chip with a voice waveform - the phone work moves to AI without dropping calls">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9c3f0"/>
      <stop offset="0.5" stop-color="#dde3f2"/>
      <stop offset="1" stop-color="#c3ecd9"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- soft depth circles -->
  <circle cx="320" cy="240" r="150" fill="#ffffff" opacity="0.30" filter="url(#soft)"/>
  <circle cx="1300" cy="650" r="180" fill="#ffffff" opacity="0.25" filter="url(#soft)"/>

  <!-- glass panel -->
  <rect x="280" y="220" width="1040" height="460" rx="40" fill="#ffffff" opacity="0.45"/>
  <rect x="280.5" y="220.5" width="1039" height="459" rx="40" stroke="#ffffff" opacity="0.7"/>

  <!-- front-desk phone chip, ringing -->
  <g transform="translate(510 450)">
    <rect x="-115" y="-115" width="230" height="230" rx="40" fill="#ffffff" opacity="0.55"/>
    <rect x="-114.5" y="-114.5" width="229" height="229" rx="40" stroke="#ffffff" opacity="0.8"/>
    <!-- classic filled handset glyph (Material Design call icon, scaled) -->
    <g transform="translate(-62 -54) scale(5.2)">
      <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" fill="#1a1a1a"/>
    </g>
    <!-- ring arcs, top right -->
    <g stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M 46 -46 a 30 30 0 0 1 20 20" opacity="0.85"/>
      <path d="M 56 -70 a 54 54 0 0 1 34 34" opacity="0.5"/>
    </g>
  </g>

  <!-- transfer pill, matching the site's "vs" pill style -->
  <g transform="translate(800 450)">
    <rect x="-44" y="-28" width="88" height="56" rx="28" fill="#111111"/>
    <g stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -18 0 h 34"/>
      <path d="M 4 -13 l 13 13 -13 13"/>
    </g>
  </g>

  <!-- AI chip -->
  <g transform="translate(1090 450)">
    <rect x="-115" y="-115" width="230" height="230" rx="40" fill="#111111"/>
    <g stroke="#ffffff" stroke-width="12" stroke-linecap="round">
      <path d="M -56 -16 v 32"/>
      <path d="M -28 -36 v 72"/>
      <path d="M 0 -54 v 108"/>
      <path d="M 28 -36 v 72"/>
      <path d="M 56 -16 v 32"/>
    </g>
    <path d="M 74 -88 l 6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" fill="#ffffff"/>
  </g>

  <!-- badge: "NO DROPPED CALLS" ~ 16 caps * 26px * 0.62 + tracking ~= 285px -->
  <g transform="translate(800 760)">
    <rect x="-200" y="-34" width="400" height="68" rx="34" fill="#111111"/>
    <text x="0" y="9" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff" letter-spacing="0.06em">NO DROPPED CALLS</text>
  </g>
</svg>
