<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="A ringing front-desk phone handing its calls across an arrow to an AI receptionist chip with a voice waveform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9c3f0"/>
      <stop offset="0.5" stop-color="#dde3f2"/>
      <stop offset="1" stop-color="#c3ecd9"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- soft depth circles -->
  <circle cx="320" cy="240" r="150" fill="#ffffff" opacity="0.30" filter="url(#soft)"/>
  <circle cx="1300" cy="650" r="180" fill="#ffffff" opacity="0.25" filter="url(#soft)"/>

  <!-- glass panel -->
  <rect x="280" y="220" width="1040" height="460" rx="40" fill="#ffffff" opacity="0.45"/>
  <rect x="280.5" y="220.5" width="1039" height="459" rx="40" stroke="#ffffff" opacity="0.7"/>

  <!-- front desk phone chip -->
  <g transform="translate(520 450)">
    <rect x="-115" y="-115" width="230" height="230" rx="40" fill="#ffffff" opacity="0.55"/>
    <rect x="-114.5" y="-114.5" width="229" height="229" rx="40" stroke="#ffffff" opacity="0.8"/>
    <g stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -44 -30 a 12 12 0 0 1 12 -12 h 18 l 10 26 -14 12 a 66 66 0 0 0 32 32 l 12 -14 26 10 v 18 a 12 12 0 0 1 -12 12 a 96 96 0 0 1 -84 -84 z"/>
      <path d="M 26 -58 a 40 40 0 0 1 32 32" opacity="0.9"/>
      <path d="M 30 -84 a 66 66 0 0 1 54 54" opacity="0.6"/>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(800 450)" stroke="#111111" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -70 0 h 130"/>
    <path d="M 34 -26 l 26 26 -26 26"/>
  </g>

  <!-- AI chip -->
  <g transform="translate(1080 450)">
    <rect x="-115" y="-115" width="230" height="230" rx="40" fill="#111111"/>
    <g stroke="#ffffff" stroke-width="12" stroke-linecap="round">
      <path d="M -56 -16 v 32"/>
      <path d="M -28 -36 v 72"/>
      <path d="M 0 -54 v 108"/>
      <path d="M 28 -36 v 72"/>
      <path d="M 56 -16 v 32"/>
    </g>
    <path d="M 74 -88 l 6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" fill="#ffffff"/>
  </g>

  <!-- badge -->
  <g transform="translate(800 760)">
    <rect x="-235" y="-34" width="470" height="68" rx="34" fill="#111111"/>
    <text x="0" y="9" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff" letter-spacing="0.06em">MOVE THE PHONE, NOT THE PERSON</text>
  </g>
</svg>
