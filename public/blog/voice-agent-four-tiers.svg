<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="Four different products are sold as AI phone answering. A phone menu or IVR is rule-based routing on keypresses; it cannot understand a sentence, and you can tell because it asks you to press a number. A conversational IVR maps speech onto a fixed list of intents; it routes without a keypad but cannot answer an unlisted question, and you can tell because it repeats the same prompt when you go off script. A chatbot with a voice is a text bot with speech synthesis bolted on; it is strictly turn-based, and you can tell because talking over it changes nothing. A voice AI agent streams audio both ways and calls tools; it can answer, look things up, book and escalate, and you can tell because interrupting it actually stops it.">
  <rect width="1200" height="630" fill="#faf8ff"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#ece7f6"/>

  <text x="60" y="60" font-size="26" font-weight="600" fill="#1a1a1a">Four things get sold as &#8220;AI answering your phone&#8221;</text>
  <text x="60" y="92" font-size="16" fill="#8a8398">Only the last one is an agent. The bottom row is how you tell them apart on a single demo call.</text>

  <!-- ===== CARD 1 ===== -->
  <rect x="60" y="126" width="255" height="366" rx="10" fill="#ffffff" stroke="#e6e0f5"/>
  <rect x="60" y="126" width="255" height="4" rx="2" fill="#cfc7e8"/>
  <text x="84" y="164" font-size="11" font-weight="600" fill="#a49dba" letter-spacing="0.08em">01</text>
  <text x="84" y="192" font-size="17" font-weight="600" fill="#1a1a1a">Phone menu (IVR)</text>
  <text x="84" y="226" font-size="13" fill="#5a5468">&#8220;Press 1 for sales,</text>
  <text x="84" y="244" font-size="13" fill="#5a5468">press 2 for support.&#8221;</text>
  <text x="84" y="284" font-size="11" font-weight="600" fill="#5b3ef0" letter-spacing="0.06em">CAN</text>
  <text x="84" y="308" font-size="13" fill="#5a5468">Route on a keypress.</text>
  <text x="84" y="326" font-size="13" fill="#5a5468">Play a recording.</text>
  <text x="84" y="366" font-size="11" font-weight="600" fill="#5b3ef0" letter-spacing="0.06em">CANNOT</text>
  <text x="84" y="390" font-size="13" fill="#5a5468">Understand a sentence.</text>
  <text x="84" y="408" font-size="13" fill="#5a5468">Do anything at all.</text>
  <line x1="84" y1="432" x2="291" y2="432" stroke="#efeaf9"/>
  <text x="84" y="456" font-size="11" font-weight="600" fill="#a49dba" letter-spacing="0.06em">TELL</text>
  <text x="84" y="478" font-size="12.5" fill="#7a7389">It asks you to press a number.</text>

  <!-- ===== CARD 2 ===== -->
  <rect x="335" y="126" width="255" height="366" rx="10" fill="#ffffff" stroke="#e6e0f5"/>
  <rect x="335" y="126" width="255" height="4" rx="2" fill="#bdb2e4"/>
  <text x="359" y="164" font-size="11" font-weight="600" fill="#a49dba" letter-spacing="0.08em">02</text>
  <text x="359" y="192" font-size="17" font-weight="600" fill="#1a1a1a">Conversational IVR</text>
  <text x="359" y="226" font-size="13" fill="#5a5468">&#8220;In a few words, tell me</text>
  <text x="359" y="244" font-size="13" fill="#5a5468">why you&#8217;re calling.&#8221;</text>
  <text x="359" y="284" font-size="11" font-weight="600" fill="#5b3ef0" letter-spacing="0.06em">CAN</text>
  <text x="359" y="308" font-size="13" fill="#5a5468">Match your words to a</text>
  <text x="359" y="326" font-size="13" fill="#5a5468">fixed list of intents.</text>
  <text x="359" y="366" font-size="11" font-weight="600" fill="#5b3ef0" letter-spacing="0.06em">CANNOT</text>
  <text x="359" y="390" font-size="13" fill="#5a5468">Answer a question that</text>
  <text x="359" y="408" font-size="13" fill="#5a5468">is not on the list.</text>
  <line x1="359" y1="432" x2="566" y2="432" stroke="#efeaf9"/>
  <text x="359" y="456" font-size="11" font-weight="600" fill="#a49dba" letter-spacing="0.06em">TELL</text>
  <text x="359" y="478" font-size="12.5" fill="#7a7389">Off script, it repeats the prompt.</text>

  <!-- ===== CARD 3 ===== -->
  <rect x="610" y="126" width="255" height="366" rx="10" fill="#ffffff" stroke="#e6e0f5"/>
  <rect x="610" y="126" width="255" height="4" rx="2" fill="#9d8ed9"/>
  <text x="634" y="164" font-size="11" font-weight="600" fill="#a49dba" letter-spacing="0.08em">03</text>
  <text x="634" y="192" font-size="17" font-weight="600" fill="#1a1a1a">Chatbot with a voice</text>
  <text x="634" y="226" font-size="13" fill="#5a5468">A text bot with speech</text>
  <text x="634" y="244" font-size="13" fill="#5a5468">synthesis bolted on.</text>
  <text x="634" y="284" font-size="11" font-weight="600" fill="#5b3ef0" letter-spacing="0.06em">CAN</text>
  <text x="634" y="308" font-size="13" fill="#5a5468">Answer free-form</text>
  <text x="634" y="326" font-size="13" fill="#5a5468">questions, one at a time.</text>
  <text x="634" y="366" font-size="11" font-weight="600" fill="#5b3ef0" letter-spacing="0.06em">CANNOT</text>
  <text x="634" y="390" font-size="13" fill="#5a5468">Be interrupted. It waits,</text>
  <text x="634" y="408" font-size="13" fill="#5a5468">then talks to the end.</text>
  <line x1="634" y1="432" x2="841" y2="432" stroke="#efeaf9"/>
  <text x="634" y="456" font-size="11" font-weight="600" fill="#a49dba" letter-spacing="0.06em">TELL</text>
  <text x="634" y="478" font-size="12.5" fill="#7a7389">Talk over it. Nothing changes.</text>

  <!-- ===== CARD 4 ===== -->
  <rect x="885" y="126" width="255" height="366" rx="10" fill="#f1edfd" stroke="#5b3ef0"/>
  <rect x="885" y="126" width="255" height="4" rx="2" fill="#5b3ef0"/>
  <text x="909" y="164" font-size="11" font-weight="600" fill="#5b3ef0" letter-spacing="0.08em">04</text>
  <text x="909" y="192" font-size="17" font-weight="600" fill="#1a1a1a">Voice AI agent</text>
  <text x="909" y="226" font-size="13" fill="#5a5468">Audio streaming both</text>
  <text x="909" y="244" font-size="13" fill="#5a5468">ways, plus tool calls.</text>
  <text x="909" y="284" font-size="11" font-weight="600" fill="#5b3ef0" letter-spacing="0.06em">CAN</text>
  <text x="909" y="308" font-size="13" fill="#5a5468">Look things up, book,</text>
  <text x="909" y="326" font-size="13" fill="#5a5468">write, page, transfer.</text>
  <text x="909" y="366" font-size="11" font-weight="600" fill="#5b3ef0" letter-spacing="0.06em">CANNOT</text>
  <text x="909" y="390" font-size="13" fill="#5a5468">Exceed the access you</text>
  <text x="909" y="408" font-size="13" fill="#5a5468">actually gave it.</text>
  <line x1="909" y1="432" x2="1116" y2="432" stroke="#ded6f4"/>
  <text x="909" y="456" font-size="11" font-weight="600" fill="#a49dba" letter-spacing="0.06em">TELL</text>
  <text x="909" y="478" font-size="12.5" fill="#7a7389">Cut it off. It stops and listens.</text>

  <!-- footnote -->
  <rect x="60" y="522" width="1080" height="52" rx="8" fill="#f1edfd"/>
  <text x="84" y="545" font-size="13" fill="#5a5468">An &#8220;AI receptionist&#8221; is card 4 packaged for one business&#8217;s phone line - the number, the script, the calendar and the escalation rules</text>
  <text x="84" y="565" font-size="13" fill="#5a5468">already wired up. Plenty of products carrying that name are still card 2 or card 3, which is why the demo call matters more than the page.</text>
</svg>
