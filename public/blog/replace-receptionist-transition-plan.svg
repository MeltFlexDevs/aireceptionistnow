<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="A three-phase transition plan: phase one the AI answers only overflow and after-hours calls, phase two it becomes the first answerer with humans as fallback, phase three it runs the phones with weekly transcript reviews">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9befa"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#faf8ff"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#ece7f6"/>

  <text x="60" y="60" font-size="26" font-weight="600" fill="#1a1a1a">The safe rollout order</text>
  <text x="60" y="94" font-size="16" fill="#8a8398">The AI earns trust on calls you were already missing before it touches the ones you weren&apos;t.</text>

  <!-- numbered steps with arrows -->
  <g>
    <path d="M 254 178 h 322" stroke="#c9befa" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 624 178 h 322" stroke="#c9befa" stroke-width="4" marker-end="url(#arrow)"/>

    <circle cx="230" cy="178" r="18" fill="#5b3ef0"/>
    <text x="230" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
    <circle cx="600" cy="178" r="18" fill="#5b3ef0"/>
    <text x="600" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
    <circle cx="970" cy="178" r="18" fill="#5b3ef0"/>
    <text x="970" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  </g>

  <!-- phase 1 -->
  <g transform="translate(70 232)">
    <rect x="0" y="0" width="320" height="316" rx="16" fill="#ffffff" stroke="#e4def1" stroke-width="2"/>
    <text x="24" y="42" font-size="13" font-weight="700" fill="#5b3ef0" letter-spacing="0.06em">WEEK 1-2 · PARALLEL RUN</text>
    <text x="24" y="78" font-size="17" font-weight="600" fill="#1a1a1a">Overflow + after-hours only</text>
    <circle cx="29" cy="109" r="2.5" fill="#8f7bf5"/>
    <text x="42" y="114" font-size="14" fill="#3a3350">Forward missed and closed-</text>
    <text x="42" y="138" font-size="14" fill="#3a3350">hours calls to the AI</text>
    <circle cx="29" cy="163" r="2.5" fill="#8f7bf5"/>
    <text x="42" y="168" font-size="14" fill="#3a3350">Humans keep answering first</text>
    <circle cx="29" cy="193" r="2.5" fill="#8f7bf5"/>
    <text x="42" y="198" font-size="14" fill="#3a3350">Worst case = the old status quo</text>
    <path d="M 24 234 h 272" stroke="#f0ecfa" stroke-width="2"/>
    <text x="24" y="266" font-size="12" font-weight="600" fill="#8a8398" letter-spacing="0.04em">RISK: NONE - THESE CALLS WERE</text>
    <text x="24" y="286" font-size="12" font-weight="600" fill="#8a8398" letter-spacing="0.04em">GOING TO VOICEMAIL ANYWAY</text>
  </g>

  <!-- phase 2 -->
  <g transform="translate(440 232)">
    <rect x="0" y="0" width="320" height="316" rx="16" fill="#ffffff" stroke="#e4def1" stroke-width="2"/>
    <text x="24" y="42" font-size="13" font-weight="700" fill="#5b3ef0" letter-spacing="0.06em">WEEK 2-3 · PROMOTION</text>
    <text x="24" y="78" font-size="17" font-weight="600" fill="#1a1a1a">AI answers first</text>
    <circle cx="29" cy="109" r="2.5" fill="#8f7bf5"/>
    <text x="42" y="114" font-size="14" fill="#3a3350">Transcripts reviewed, answers</text>
    <text x="42" y="138" font-size="14" fill="#3a3350">patched, rules tightened</text>
    <circle cx="29" cy="163" r="2.5" fill="#8f7bf5"/>
    <text x="42" y="168" font-size="14" fill="#3a3350">Forwarding flipped: AI is the</text>
    <text x="42" y="192" font-size="14" fill="#3a3350">first ring, humans the fallback</text>
    <path d="M 24 234 h 272" stroke="#f0ecfa" stroke-width="2"/>
    <text x="24" y="266" font-size="12" font-weight="600" fill="#8a8398" letter-spacing="0.04em">SAFETY NET: LIVE TRANSFER ON</text>
    <text x="24" y="286" font-size="12" font-weight="600" fill="#8a8398" letter-spacing="0.04em">RULES YOU DEFINE</text>
  </g>

  <!-- phase 3 -->
  <g transform="translate(810 232)">
    <rect x="0" y="0" width="320" height="316" rx="16" fill="#ffffff" stroke="#e4def1" stroke-width="2"/>
    <text x="24" y="42" font-size="13" font-weight="700" fill="#5b3ef0" letter-spacing="0.06em">ONGOING · STEADY STATE</text>
    <text x="24" y="78" font-size="17" font-weight="600" fill="#1a1a1a">AI runs the phones</text>
    <circle cx="29" cy="109" r="2.5" fill="#8f7bf5"/>
    <text x="42" y="114" font-size="14" fill="#3a3350">Human hours redeployed to</text>
    <text x="42" y="138" font-size="14" fill="#3a3350">walk-ins, billing, growth</text>
    <circle cx="29" cy="163" r="2.5" fill="#8f7bf5"/>
    <text x="42" y="168" font-size="14" fill="#3a3350">Ten-minute transcript review</text>
    <text x="42" y="192" font-size="14" fill="#3a3350">every week</text>
    <path d="M 24 234 h 272" stroke="#f0ecfa" stroke-width="2"/>
    <text x="24" y="266" font-size="12" font-weight="600" fill="#8a8398" letter-spacing="0.04em">MAINTENANCE: PATCH ANSWERS</text>
    <text x="24" y="286" font-size="12" font-weight="600" fill="#8a8398" letter-spacing="0.04em">AS THE BUSINESS CHANGES</text>
  </g>
</svg>
