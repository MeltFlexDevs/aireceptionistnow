<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="Bar chart of the measured length of nine voicemail greetings we recorded with an AI voice at 0.9 speed. Plumber general greeting, 28 words: 7.8 seconds. Salon, with clients, 30 words: 9.5 seconds. Law office, 42 words: 13.3 seconds. Insurance agent away from desk, 41 words: 14.9 seconds. Out of office until Monday, 39 words: 15.7 seconds. Plumber after hours, 47 words: 15.9 seconds. Dental holiday closure, 39 words: 17.3 seconds. Family medicine, 48 words: 18.5 seconds. The 100-word classic greeting: 32.0 seconds. A dashed line marks 20 seconds; eight of the nine fit under it. Greetings with phone numbers, dates and times run longer per word.">
