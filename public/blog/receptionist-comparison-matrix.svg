<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparison of the three ways to answer business calls: an answering service has a shared call-center agent take a message and bills per minute; a virtual receptionist is a remote human who books and transfers during staffed hours on minute bundles; an AI receptionist is software that books, answers, and escalates 24/7 in parallel for a flat monthly fee">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- header row -->
  <text x="600" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="300" fill="#888">Same phone ringing — three different things picking it up</text>

  <!-- Answering service card -->
  <g transform="translate(55 90)" font-family="Inter, sans-serif">
    <rect x="0" y="0" width="340" height="450" rx="14" fill="#fafafa" stroke="#e5e5e5" stroke-width="2"/>
    <text x="28" y="52" font-size="20" font-weight="600" fill="#1a1a1a">Answering service</text>
    <text x="28" y="78" font-size="13" font-weight="300" fill="#888">The message pipeline</text>
    <line x1="28" y1="100" x2="312" y2="100" stroke="#e5e5e5" stroke-width="2"/>

    <text x="28" y="140" font-size="12" font-weight="500" fill="#999" letter-spacing="0.06em">WHO PICKS UP</text>
    <text x="28" y="164" font-size="15" font-weight="400" fill="#1a1a1a">Call-center agent shared</text>
    <text x="28" y="185" font-size="15" font-weight="400" fill="#1a1a1a">across many clients</text>

    <text x="28" y="230" font-size="12" font-weight="500" fill="#999" letter-spacing="0.06em">FINISHES ON THE CALL</text>
    <text x="28" y="254" font-size="15" font-weight="400" fill="#1a1a1a">Takes a message, relays it</text>

    <text x="28" y="299" font-size="12" font-weight="500" fill="#999" letter-spacing="0.06em">COVERAGE</text>
    <text x="28" y="323" font-size="15" font-weight="400" fill="#1a1a1a">Often 24/7, at premium rates</text>

    <text x="28" y="368" font-size="12" font-weight="500" fill="#999" letter-spacing="0.06em">HOW IT BILLS</text>
    <text x="28" y="392" font-size="15" font-weight="400" fill="#1a1a1a">Per minute or per call —</text>
    <text x="28" y="413" font-size="15" font-weight="400" fill="#1a1a1a">spikes when you get busy</text>
  </g>

  <!-- Virtual receptionist card -->
  <g transform="translate(430 90)" font-family="Inter, sans-serif">
    <rect x="0" y="0" width="340" height="450" rx="14" fill="#fafafa" stroke="#e5e5e5" stroke-width="2"/>
    <text x="28" y="52" font-size="20" font-weight="600" fill="#1a1a1a">Virtual receptionist</text>
    <text x="28" y="78" font-size="13" font-weight="300" fill="#888">The remote front desk</text>
    <line x1="28" y1="100" x2="312" y2="100" stroke="#e5e5e5" stroke-width="2"/>

    <text x="28" y="140" font-size="12" font-weight="500" fill="#999" letter-spacing="0.06em">WHO PICKS UP</text>
    <text x="28" y="164" font-size="15" font-weight="400" fill="#1a1a1a">Remote human trained</text>
    <text x="28" y="185" font-size="15" font-weight="400" fill="#1a1a1a">on your business</text>

    <text x="28" y="230" font-size="12" font-weight="500" fill="#999" letter-spacing="0.06em">FINISHES ON THE CALL</text>
    <text x="28" y="254" font-size="15" font-weight="400" fill="#1a1a1a">Books, answers, transfers</text>

    <text x="28" y="299" font-size="12" font-weight="500" fill="#999" letter-spacing="0.06em">COVERAGE</text>
    <text x="28" y="323" font-size="15" font-weight="400" fill="#1a1a1a">Staffed hours; after-hours</text>
    <text x="28" y="344" font-size="15" font-weight="400" fill="#1a1a1a">costs extra</text>

    <text x="28" y="389" font-size="12" font-weight="500" fill="#999" letter-spacing="0.06em">HOW IT BILLS</text>
    <text x="28" y="413" font-size="15" font-weight="400" fill="#1a1a1a">Monthly minute bundles</text>
    <text x="28" y="434" font-size="15" font-weight="400" fill="#1a1a1a">plus overage</text>
  </g>

  <!-- AI receptionist card (accent) -->
  <g transform="translate(805 90)" font-family="Inter, sans-serif">
    <rect x="0" y="0" width="340" height="450" rx="14" fill="#1a1a1a"/>
    <text x="28" y="52" font-size="20" font-weight="600" fill="#ffffff">AI receptionist</text>
    <text x="28" y="78" font-size="13" font-weight="300" fill="rgba(255,255,255,0.55)">The software front desk</text>
    <line x1="28" y1="100" x2="312" y2="100" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

    <text x="28" y="140" font-size="12" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="0.06em">WHO PICKS UP</text>
    <text x="28" y="164" font-size="15" font-weight="400" fill="#ffffff">Software — a voice AI</text>
    <text x="28" y="185" font-size="15" font-weight="400" fill="#ffffff">agent on your number</text>

    <text x="28" y="230" font-size="12" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="0.06em">FINISHES ON THE CALL</text>
    <text x="28" y="254" font-size="15" font-weight="400" fill="#ffffff">Books, answers, qualifies,</text>
    <text x="28" y="275" font-size="15" font-weight="400" fill="#ffffff">escalates to a human</text>

    <text x="28" y="320" font-size="12" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="0.06em">COVERAGE</text>
    <text x="28" y="344" font-size="15" font-weight="400" fill="#ffffff">24/7 by default, answers</text>
    <text x="28" y="365" font-size="15" font-weight="400" fill="#ffffff">calls in parallel</text>

    <text x="28" y="410" font-size="12" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="0.06em">HOW IT BILLS</text>
    <text x="28" y="434" font-size="15" font-weight="400" fill="#ffffff">Flat monthly fee — stays flat</text>
  </g>

  <!-- footer note -->
  <text x="600" y="588" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="300" fill="#999">The label on the pricing page doesn&#8217;t always match the column — always ask who, or what, actually answers.</text>
</svg>
