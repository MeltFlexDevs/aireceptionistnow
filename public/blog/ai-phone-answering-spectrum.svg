<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="Five categories of product can answer the same business phone call, arranged from most to least assembly required. A developer platform such as Twilio Conversation Relay hands you streaming audio and expects you to supply engineers, a model, hosting and someone on call. A business phone system with AI attached, such as Dialpad, expects you to move your phone system and buy seats. A support suite with AI, such as Freshworks Freddy, expects you to already run your help desk there. A vertical AI platform such as EliseAI expects portfolio scale and an enterprise contract. A packaged AI receptionist expects a phone number, your opening hours and an afternoon. The pricing model changes with the category: usage per minute, credits spent when the AI acts, per agent seat plus per session, a quoted enterprise contract, and a flat monthly fee per line.">
  <rect width="1200" height="630" fill="#faf8ff"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#ece7f6"/>

  <text x="60" y="60" font-size="26" font-weight="600" fill="#1a1a1a">Same phone call. Five different products.</text>
  <text x="60" y="92" font-size="16" fill="#8a8398">They are rarely compared because they are rarely the same shape. What differs is what you have to bring.</text>

  <!-- axis -->
  <line x1="80" y1="300" x2="1120" y2="300" stroke="#d9d2f2" stroke-width="2" stroke-linecap="round"/>
  <text x="80" y="580" font-size="11" font-weight="600" fill="#a49dba" letter-spacing="0.08em">YOU ASSEMBLE IT</text>
  <text x="1120" y="580" font-size="11" font-weight="600" fill="#5b3ef0" letter-spacing="0.08em" text-anchor="end">IT ARRIVES ASSEMBLED</text>
  <line x1="80" y1="596" x2="1120" y2="596" stroke="#ece7f6"/>

  <g text-anchor="middle">
    <!-- 1 -->
    <text x="160" y="176" font-size="12" font-weight="600" fill="#a49dba" letter-spacing="0.06em">PLATFORM</text>
    <text x="160" y="204" font-size="17" font-weight="600" fill="#1a1a1a">Twilio</text>
    <text x="160" y="226" font-size="13" fill="#7a7389">Conversation Relay</text>
    <circle cx="160" cy="300" r="9" fill="#5b3ef0"/>
    <text x="160" y="342" font-size="13" fill="#5a5468">You bring engineers,</text>
    <text x="160" y="360" font-size="13" fill="#5a5468">a model, hosting and</text>
    <text x="160" y="378" font-size="13" fill="#5a5468">someone on call at 3am.</text>
    <text x="160" y="416" font-size="12" fill="#8a8398">Billed per minute</text>

    <!-- 2 -->
    <text x="400" y="176" font-size="12" font-weight="600" fill="#a49dba" letter-spacing="0.06em">PHONE SYSTEM + AI</text>
    <text x="400" y="204" font-size="17" font-weight="600" fill="#1a1a1a">Dialpad</text>
    <text x="400" y="226" font-size="13" fill="#7a7389">AI agents on your lines</text>
    <circle cx="400" cy="300" r="9" fill="#5b3ef0"/>
    <text x="400" y="342" font-size="13" fill="#5a5468">You bring your whole</text>
    <text x="400" y="360" font-size="13" fill="#5a5468">phone system, and move</text>
    <text x="400" y="378" font-size="13" fill="#5a5468">it if it lives elsewhere.</text>
    <text x="400" y="416" font-size="12" fill="#8a8398">Credits, spent when AI acts</text>

    <!-- 3 -->
    <text x="640" y="176" font-size="12" font-weight="600" fill="#a49dba" letter-spacing="0.06em">SUPPORT SUITE + AI</text>
    <text x="640" y="204" font-size="17" font-weight="600" fill="#1a1a1a">Freshworks</text>
    <text x="640" y="226" font-size="13" fill="#7a7389">Freddy AI agent</text>
    <circle cx="640" cy="300" r="9" fill="#5b3ef0"/>
    <text x="640" y="342" font-size="13" fill="#5a5468">You bring a help desk</text>
    <text x="640" y="360" font-size="13" fill="#5a5468">that already runs there.</text>
    <text x="640" y="378" font-size="13" fill="#5a5468">Tickets first, voice after.</text>
    <text x="640" y="416" font-size="12" fill="#8a8398">Per agent seat, plus per session</text>

    <!-- 4 -->
    <text x="880" y="176" font-size="12" font-weight="600" fill="#a49dba" letter-spacing="0.06em">VERTICAL AI</text>
    <text x="880" y="204" font-size="17" font-weight="600" fill="#1a1a1a">EliseAI</text>
    <text x="880" y="226" font-size="13" fill="#7a7389">Multifamily and healthcare</text>
    <circle cx="880" cy="300" r="9" fill="#5b3ef0"/>
    <text x="880" y="342" font-size="13" fill="#5a5468">You bring portfolio</text>
    <text x="880" y="360" font-size="13" fill="#5a5468">scale and an enterprise</text>
    <text x="880" y="378" font-size="13" fill="#5a5468">contract. No price page.</text>
    <text x="880" y="416" font-size="12" fill="#8a8398">Quoted, enterprise contract</text>

    <!-- 5 -->
    <text x="1090" y="176" font-size="12" font-weight="600" fill="#5b3ef0" letter-spacing="0.06em">PACKAGED</text>
    <text x="1090" y="204" font-size="17" font-weight="600" fill="#1a1a1a">AI receptionist</text>
    <text x="1090" y="226" font-size="13" fill="#7a7389">One business, one line</text>
    <circle cx="1090" cy="300" r="9" fill="#5b3ef0"/>
    <text x="1090" y="342" font-size="13" fill="#5a5468">You bring a number,</text>
    <text x="1090" y="360" font-size="13" fill="#5a5468">your hours and an</text>
    <text x="1090" y="378" font-size="13" fill="#5a5468">afternoon to test it.</text>
    <text x="1090" y="416" font-size="12" fill="#8a8398">Flat, per line</text>
  </g>

  <!-- footnote -->
  <rect x="60" y="466" width="1080" height="70" rx="8" fill="#f1edfd"/>
  <text x="84" y="492" font-size="13" fill="#5a5468">None of these is the &#8220;best&#8221; one. The mistake is buying from the wrong column: paying platform prices for a problem that a packaged line</text>
  <text x="84" y="512" font-size="13" fill="#5a5468">solves in an afternoon, or buying a packaged line when what you actually needed was a deep write-integration into one industry&#8217;s software.</text>
  <text x="84" y="532" font-size="12" fill="#8a8398" font-style="italic">Illustrative. Categories and billing shapes as published by each vendor in August 2026; confirm current terms before you buy.</text>
</svg>
