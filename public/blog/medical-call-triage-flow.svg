<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="A triage flow for patient calls: every call is answered by the AI, then emergency language routes the caller to 911 instantly, urgent calls page the on-call provider, and routine calls are booked onto the calendar or logged for the morning">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9befa"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#faf8ff"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#ece7f6"/>

  <text x="60" y="60" font-size="26" font-weight="600" fill="#1a1a1a">Three streams, three destinations</text>
  <text x="60" y="94" font-size="16" fill="#8a8398">The AI applies routing rules a clinician approved. Clinical judgment never leaves the clinicians.</text>

  <!-- incoming call node -->
  <g transform="translate(60 285)">
    <rect x="0" y="0" width="240" height="110" rx="16" fill="#5b3ef0"/>
    <text x="120" y="48" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Every patient call</text>
    <text x="120" y="76" font-size="14" fill="#dcd4fb" text-anchor="middle">answered instantly, 24/7</text>
  </g>

  <!-- arrows with heads -->
  <g stroke="#c9befa" stroke-width="3.5" fill="none">
    <path d="M 300 315 C 380 315 370 197 440 195" marker-end="url(#arrow)"/>
    <path d="M 300 340 h 140" marker-end="url(#arrow)"/>
    <path d="M 300 365 C 380 365 370 483 440 485" marker-end="url(#arrow)"/>
  </g>

  <!-- emergency -->
  <g transform="translate(450 140)">
    <rect x="0" y="0" width="640" height="110" rx="16" fill="#ffffff" stroke="#e4def1" stroke-width="2"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#1a1a1a"/>
    <g transform="translate(524 18)">
      <rect x="0" y="0" width="92" height="30" rx="15" fill="#1a1a1a"/>
      <text x="46" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.04em">DIAL 911</text>
    </g>
    <text x="30" y="40" font-size="13" font-weight="700" fill="#1a1a1a" letter-spacing="0.06em">EMERGENCY LANGUAGE</text>
    <text x="30" y="70" font-size="15" fill="#3a3350">&quot;Hang up and dial 911&quot; - immediately, identically, every time.</text>
    <text x="30" y="94" font-size="13" fill="#8a8398">No advice, no triage conversation, no delay.</text>
  </g>

  <!-- urgent -->
  <g transform="translate(450 285)">
    <rect x="0" y="0" width="640" height="110" rx="16" fill="#ffffff" stroke="#e4def1" stroke-width="2"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#5b3ef0"/>
    <g transform="translate(516 18)">
      <rect x="0" y="0" width="100" height="30" rx="15" fill="#5b3ef0"/>
      <text x="50" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.04em">ON-CALL</text>
    </g>
    <text x="30" y="40" font-size="13" font-weight="700" fill="#5b3ef0" letter-spacing="0.06em">URGENT, NOT 911</text>
    <text x="30" y="70" font-size="15" fill="#3a3350">Worsening symptoms or post-op concerns page the on-call provider.</text>
    <text x="30" y="94" font-size="13" fill="#8a8398">Ambiguous calls fail toward escalation by design.</text>
  </g>

  <!-- routine -->
  <g transform="translate(450 430)">
    <rect x="0" y="0" width="640" height="110" rx="16" fill="#ffffff" stroke="#e4def1" stroke-width="2"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#8f7bf5"/>
    <g transform="translate(506 18)">
      <rect x="0" y="0" width="110" height="30" rx="15" fill="#8f7bf5"/>
      <text x="55" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.04em">CALENDAR</text>
    </g>
    <text x="30" y="40" font-size="13" font-weight="700" fill="#8f7bf5" letter-spacing="0.06em">ROUTINE - THE BULK</text>
    <text x="30" y="70" font-size="15" fill="#3a3350">Booked, answered from the knowledge base, or logged for morning.</text>
    <text x="30" y="94" font-size="13" fill="#8a8398">Scheduling, prep questions, refills - finished without waking anyone.</text>
  </g>
</svg>
