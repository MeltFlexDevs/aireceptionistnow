<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="Ten test calls to place during a free trial of a live answering service, grouped into three kinds. Timing calls: one at 8:58 a.m. as the business opens, one at 12:15 p.m. over lunch, one at 2:10 a.m. overnight, one on Saturday afternoon, and two placed at the same moment from two phones to see how a second caller is queued. Script calls: a caller who asks for a price the script does not contain, a caller who describes something urgent, and a caller who asks for Spanish. Delivery call: a routine message, timed from hang-up to the moment it reaches you. For every call, write down seconds to a human, seconds on hold, whether the caller's name and number were captured correctly, and the billed minutes on the invoice.">
  <rect width="1200" height="630" fill="#faf8ff"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#ece7f6"/>

  <text x="60" y="58" font-size="26" font-weight="600" fill="#1a1a1a">Ten test calls before the trial ends</text>
  <text x="60" y="88" font-size="16" fill="#8a8398">Most vendors do not publish an answer speed. A trial is the only place you can measure one.</text>

  <!-- column 1: timing -->
  <rect x="60" y="120" width="340" height="56" rx="10" fill="#1a1a1a"/>
  <text x="230" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff" letter-spacing="0.05em">TIMING  -  6 CALLS</text>
  <text x="230" y="165" text-anchor="middle" font-size="12" fill="#b9b2cc">when staffing is thinnest</text>
  <rect x="60" y="192" width="340" height="250" rx="10" fill="#ffffff" stroke="#e2dcf5" stroke-width="1.5"/>
  <g font-size="14" fill="#1a1a1a">
    <text x="84" y="226">1   8:58 a.m., as you open</text>
    <text x="84" y="258">2   12:15 p.m., over lunch</text>
    <text x="84" y="290">3   2:10 a.m., overnight</text>
    <text x="84" y="322">4   Saturday afternoon</text>
    <text x="84" y="354">5 + 6   two phones, same second</text>
  </g>
  <text x="84" y="386" font-size="12" fill="#5a5468">Calls 5 and 6 show you the queue: does</text>
  <text x="84" y="404" font-size="12" fill="#5a5468">the second caller hold, ring, or hear</text>
  <text x="84" y="422" font-size="12" fill="#5a5468">a recording?</text>

  <!-- column 2: script -->
  <rect x="430" y="120" width="340" height="56" rx="10" fill="#5b3ef0"/>
  <text x="600" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff" letter-spacing="0.05em">SCRIPT  -  3 CALLS</text>
  <text x="600" y="165" text-anchor="middle" font-size="12" fill="#d8cffb">what agents do off the page</text>
  <rect x="430" y="192" width="340" height="250" rx="10" fill="#ffffff" stroke="#e2dcf5" stroke-width="1.5"/>
  <g font-size="14" fill="#1a1a1a">
    <text x="454" y="226">7   Ask a price the script</text>
    <text x="454" y="246">     does not contain</text>
    <text x="454" y="282">8   Describe something urgent</text>
    <text x="454" y="302">     (your own definition)</text>
    <text x="454" y="338">9   Ask for Spanish</text>
  </g>
  <text x="454" y="386" font-size="12" fill="#5a5468">A good agent says &#8220;I'll have someone</text>
  <text x="454" y="404" font-size="12" fill="#5a5468">call you with that.&#8221; A bad one guesses.</text>

  <!-- column 3: delivery -->
  <rect x="800" y="120" width="340" height="56" rx="10" fill="#0f766e"/>
  <text x="970" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff" letter-spacing="0.05em">DELIVERY  -  1 CALL</text>
  <text x="970" y="165" text-anchor="middle" font-size="12" fill="#cdeee9">the part you actually receive</text>
  <rect x="800" y="192" width="340" height="250" rx="10" fill="#ffffff" stroke="#cdeee9" stroke-width="1.5"/>
  <g font-size="14" fill="#1a1a1a">
    <text x="824" y="226">10   A routine message.</text>
    <text x="824" y="258">Time it from hang-up to the</text>
    <text x="824" y="278">moment it reaches your phone.</text>
  </g>
  <text x="824" y="322" font-size="12" fill="#5a5468">Then check the spelling of the</text>
  <text x="824" y="340" font-size="12" fill="#5a5468">name and every digit of the</text>
  <text x="824" y="358" font-size="12" fill="#5a5468">callback number.</text>

  <rect x="60" y="470" width="1080" height="1" fill="#ece7f6"/>
  <text x="60" y="506" font-size="15" font-weight="600" fill="#1a1a1a">Write down four numbers for every call</text>
  <g font-size="14" fill="#5a5468">
    <text x="60" y="536">Seconds until a human spoke</text>
    <text x="330" y="536">Seconds on hold</text>
    <text x="540" y="536">Name and number captured correctly: yes / no</text>
    <text x="900" y="536">Billed minutes on the invoice</text>
  </g>
  <text x="60" y="590" font-size="13" fill="#8a8398">Use a phone the agents will not recognise, and space the calls over the whole trial. Illustration by AI Receptionist Now.</text>
</svg>
